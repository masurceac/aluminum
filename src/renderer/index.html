<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Local content only — nothing here is ever fetched over the network.
       style-src needs 'unsafe-inline' because sonner injects its stylesheet as
       a <style> element at runtime; Radix positions its popovers through the
       CSSOM, which CSP does not gate. img-src data: carries inline SVG. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Aluminum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <script src="renderer.js"></script>
</body>
</html>
